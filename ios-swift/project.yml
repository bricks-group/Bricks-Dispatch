# XcodeGen project spec — run `xcodegen generate` to create BricksDispatch.xcodeproj
# Install: brew install xcodegen

name: BricksDispatch
options:
  bundleIdPrefix: com.bricks.dispatch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16"

packages:
  BricksCore:
    path: BricksCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Fill in: Apple Developer Team ID

targets:

  BricksDispatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BricksDispatch
    resources:
      - path: BricksDispatch/Resources
    dependencies:
      - package: BricksCore
      - target: BricksDispatchWidgets
        embed: true
      - sdk: WidgetKit.framework
    entitlements:
      path: BricksDispatch/BricksDispatch.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.applesignin: [Default]
        aps-environment: production
        com.apple.security.application-groups: [group.com.bricks.dispatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricks.dispatch
        INFOPLIST_FILE: BricksDispatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BricksDispatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BricksDispatchWatch
    dependencies:
      - package: BricksCore
      - target: BricksDispatch
    entitlements:
      path: BricksDispatchWatch/BricksDispatchWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bricks.dispatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricks.dispatch.watchkitapp
        INFOPLIST_FILE: BricksDispatchWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BricksDispatchWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BricksDispatchWidgets
    dependencies:
      - package: BricksCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

    entitlements:
      path: BricksDispatchWidgets/BricksDispatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bricks.dispatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricks.dispatch.widgets
        INFOPLIST_FILE: BricksDispatchWidgets/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
