# XcodeGen project spec — run `xcodegen generate` to create BricksDispatch.xcodeproj
# Install: brew install xcodegen

name: BricksDispatch
options:
  bundleIdPrefix: com.bricks.dispatch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16"

packages:
  BricksCore:
    path: ../../BricksCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Fill in: Apple Developer Team ID

targets:

  BricksDispatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.bricks.dispatch
    sources:
      - path: BricksDispatch
    resources:
      - path: BricksDispatch/Resources
    dependencies:
      - package: BricksCore
    settings:
      base:
        INFOPLIST_FILE: BricksDispatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BricksDispatch/BricksDispatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      com.apple.developer.associated-domains: []
      com.apple.security.app-sandbox: true
      com.apple.developer.applesignin: ["Default"]
      aps-environment: production
      com.apple.security.application-groups:
        - group.com.bricks.dispatch

  BricksDispatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.bricks.dispatch.watchkitapp
    sources:
      - path: BricksDispatchWatch
    dependencies:
      - package: BricksCore
      - target: BricksDispatch
    settings:
      base:
        INFOPLIST_FILE: BricksDispatchWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      com.apple.security.application-groups:
        - group.com.bricks.dispatch
