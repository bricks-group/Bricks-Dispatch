name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        # FIXED 2026-08-16: the `curl .../install.sh | sh` approach this used
        # to have was doubly broken -- first the sh/bash mismatch ("Syntax
        # error: redirection unexpected"), and after fixing that, a second,
        # deeper problem: supabase.com/install.sh no longer exists at all.
        # It 404s and returns the marketing site's own HTML 404 page, which
        # then gets piped into bash and fails trying to execute HTML as shell
        # commands. Checked current docs (supabase.com/docs/guides/functions/
        # deploy#github-actions) -- curl-based install isn't a documented
        # method anymore; the official, current approach is this action.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Deno type checks
        run: deno check supabase/functions/  # Assuming functions are directly under supabase/functions

      - name: Deploy Supabase Functions
        # FIXED 2026-08-16: this repo has never been `supabase link`-ed (no
        # supabase/config.toml existed), so even with a valid token the CLI
        # had no project ref to deploy to. Linking explicitly here instead of
        # relying on a committed config.toml, since the project ref itself
        # isn't secret but keeping it out of a tracked file avoids drift if
        # it's ever needed elsewhere.
        run: |
          supabase link --project-ref ctqwxwrcxwruaqojohpf
          supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
