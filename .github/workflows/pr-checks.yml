name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Deno lint
        run: deno fmt --check supabase/functions/

      - name: Run Deno type checks
        run: deno check supabase/functions/
