name: Migration RLS Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sql'
      - 'scripts/check_migration_rls.py'
      - '.github/workflows/migration-rls-check.yml'

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Every public table enables row level security
        run: python3 scripts/check_migration_rls.py
