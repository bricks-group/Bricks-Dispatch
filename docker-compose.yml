version: "3.9"
services:
  dispatch-api:
    build: .
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    env_file:
      - backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
